<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ganesha Arts - Custom Order & Portal</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        :root {
            --bg-color: #0f0f12;
            --card-bg: #1a1a24;
            --accent: #e5a93c;
            --text-main: #ffffff;
            --text-sub: #a0a0b0;
            --border: #2a2a3a;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-main);
            margin: 0;
            padding: 20px;
        }

        .container {
            max-width: 650px;
            margin: 0 auto;
            background: var(--card-bg);
            padding: 25px;
            border-radius: 12px;
            border: 1px solid var(--border);
            box-shadow: 0 8px 24px rgba(0,0,0,0.5);
        }

        h2, h3 {
            color: var(--accent);
            margin-bottom: 15px;
        }

        .form-group {
            margin-bottom: 15px;
        }

        label {
            display: block;
            margin-bottom: 6px;
            color: var(--text-sub);
            font-size: 14px;
        }

        input, select, textarea {
            width: 100%;
            padding: 10px;
            border-radius: 6px;
            border: 1px solid var(--border);
            background: #12121a;
            color: #fff;
            box-sizing: border-box;
            font-size: 14px;
        }

        input:focus, select:focus, textarea:focus {
            outline: none;
            border-color: var(--accent);
        }

        .grid-2 {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 12px;
        }

        .img-preview {
            max-width: 100%;
            max-height: 160px;
            margin-top: 10px;
            border-radius: 6px;
            display: none;
            border: 1px dashed var(--accent);
        }

        .payment-box {
            background: #14141f;
            border: 1px solid var(--accent);
            padding: 15px;
            border-radius: 8px;
            margin-top: 20px;
        }

        .price-tag {
            color: var(--accent);
            font-size: 20px;
            font-weight: bold;
        }

        button {
            width: 100%;
            padding: 14px;
            background: var(--accent);
            color: #000;
            border: none;
            border-radius: 6px;
            font-weight: bold;
            font-size: 16px;
            cursor: pointer;
            margin-top: 20px;
            transition: 0.2s;
        }

        button:hover {
            opacity: 0.9;
        }
    </style>
</head>
<body>

<div class="container">
    <h2>🎨 Place Custom Order</h2>
    <form id="orderForm">
        <!-- Artwork Selection -->
        <div class="form-group">
            <label>Artwork Type</label>
            <select id="artworkType" required>
                <option value="Krishna Idol">Krishna Idol Artwork</option>
                <option value="Ganesha Idol">Ganesha Idol Artwork</option>
                <option value="Custom Portrait">Custom Portrait</option>
                <option value="Wall Mural">Wall Mural / Decorative</option>
            </select>
        </div>

        <div class="form-group">
            <label>Artwork Size & Estimated Base Price</label>
            <select id="artworkSize" onchange="updatePrice()" required>
                <option value="Small (under 12 inch)" data-price="2500">Small (under 12") - ₹2,500</option>
                <option value="Medium (12-24 inch)" data-price="5000">Medium (12"-24") - ₹5,000</option>
                <option value="Large (24+ inch)" data-price="10000">Large (24"+) - ₹10,000</option>
            </select>
        </div>

        <div class="form-group">
            <label>Special Requirements / Design Instructions</label>
            <textarea id="specialRequirements" rows="3" placeholder="Specify colors, pose, framing, or custom notes..."></textarea>
        </div>

        <!-- Reference Image Upload -->
        <div class="form-group">
            <label>Upload Reference Photo (From Phone Gallery)</label>
            <input type="file" id="imageFile" accept="image/*" onchange="previewImage(event)">
            <img id="preview" class="img-preview" alt="Reference Image Preview">
        </div>

        <div class="form-group">
            <label>Or Reference Link (Drive, Pinterest, Instagram)</label>
            <input type="url" id="referenceUrl" placeholder="https://...">
        </div>

        <hr style="border: 0.5px solid var(--border); margin: 25px 0;">

        <!-- Delivery & Shipping Info -->
        <h3>📍 Delivery Address Details</h3>
        <div class="grid-2">
            <div class="form-group">
                <label>Contact Name</label>
                <input type="text" id="contactName" required placeholder="Full Name">
            </div>
            <div class="form-group">
                <label>Contact Phone</label>
                <input type="tel" id="contactPhone" required placeholder="Mobile Number">
            </div>
        </div>

        <div class="form-group">
            <label>Full Shipping Address</label>
            <textarea id="shippingAddress" rows="2" required placeholder="House No, Building, Street, Landmark..."></textarea>
        </div>

        <div class="grid-2">
            <div class="form-group">
                <label>City</label>
                <input type="text" id="city" required placeholder="City Name">
            </div>
            <div class="form-group">
                <label>Pincode</label>
                <input type="text" id="pincode" required placeholder="6-digit PIN">
            </div>
        </div>

        <!-- Payment Setup -->
        <div class="payment-box">
            <h3>💳 Select Payment Mode</h3>
            <div class="form-group">
                <label><input type="radio" name="payOption" value="advance" checked onchange="updatePrice()"> Pay 20% Advance Booking Fee (80% Balance on COD)</label>
                <label><input type="radio" name="payOption" value="full" onchange="updatePrice()"> Pay 100% Full Amount Online</label>
            </div>
            <div style="margin-top: 10px;">Amount Payable Now: <span class="price-tag" id="payablePrice">₹500</span></div>
        </div>

        <button type="submit" id="submitBtn">Proceed to Pay & Place Order</button>
    </form>
</div>

<script>
    // -------------------------------------------------------------
    // REPLACE THESE TWO LINES WITH YOUR ACTUAL SUPABASE CREDENTIALS
    // -------------------------------------------------------------
    const SUPABASE_URL = "https://nojhnduyzjielryljtch.supabase.co/rest/v1/";
    const SUPABASE_KEY = "sb_publishable_yrsM7YmUA2X1qvbYUCXUpw_pAUb6VVq";
    // -------------------------------------------------------------

    const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);
    let base64ImageData = "";

    // Image Preview Handler
    function previewImage(event) {
        const file = event.target.files[0];
        if (file) {
            const reader = new FileReader();
            reader.onload = function(e) {
                base64ImageData = e.target.result;
                const imgElem = document.getElementById('preview');
                imgElem.src = base64ImageData;
                imgElem.style.display = 'block';
            };
            reader.readAsDataURL(file);
        }
    }

    // Dynamic Price Calculator
    function updatePrice() {
        const sizeSelect = document.getElementById('artworkSize');
        const selectedOption = sizeSelect.options[sizeSelect.selectedIndex];
        const basePrice = parseFloat(selectedOption.getAttribute('data-price')) || 2500;
        
        const payOption = document.querySelector('input[name="payOption"]:checked').value;
        const payable = payOption === 'advance' ? (basePrice * 0.20) : basePrice;
        
        document.getElementById('payablePrice').innerText = `₹${payable.toLocaleString('en-IN')}`;
    }

    updatePrice();

    // Form Submission Logic
    document.getElementById('orderForm').addEventListener('submit', async (e) => {
        e.preventDefault();
        const submitBtn = document.getElementById('submitBtn');
        submitBtn.disabled = true;
        submitBtn.innerText = "Processing Order...";

        try {
            const userResponse = await supabaseClient.auth.getUser();
            const user = userResponse.data ? userResponse.data.user : null;

            const payload = {
                user_id: user ? user.id : null,
                artwork_type: document.getElementById('artworkType').value,
                size: document.getElementById('artworkSize').value,
                special_requirements: document.getElementById('specialRequirements').value,
                contact_name: document.getElementById('contactName').value,
                contact_phone: document.getElementById('contactPhone').value,
                shipping_address: document.getElementById('shippingAddress').value,
                city: document.getElementById('city').value,
                pincode: document.getElementById('pincode').value,
                reference: document.getElementById('referenceUrl').value,
                image_data: base64ImageData,
                amount: parseFloat(document.getElementById('payablePrice').innerText.replace('₹','').replace(/,/g,'')),
                payment_method: 'Online Gateway Simulation',
                payment_status: 'Paid (Pending Verification)',
                gateway_payment_id: 'PAY_' + Math.floor(100000 + Math.random() * 900000)
            };

            const { data, error } = await supabaseClient.from('orders').insert([payload]);

            if (error) throw error;

            alert("✨ Order Placed Successfully! Your shipping address and payment details have been submitted.");
            window.location.reload();

        } catch (err) {
            alert("Could not place order: " + err.message);
            submitBtn.disabled = false;
            submitBtn.innerText = "Proceed to Pay & Place Order";
        }
    });
</script>

</body>
</html>
